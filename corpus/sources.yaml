# The Library — source register (Tier 1, M1).
# One entry per document. fetch.py tries `urls` in order (official first), then the
# Wayback Machine snapshot of the first URL. The step that succeeded is recorded in
# corpus/provenance/<id>.json as fetch_method.
#
# Field meanings:
#   pages          PDF page ranges to extract ("a-b", 1-based). Omitted = whole document.
#                  Used only to keep large compilations to the provisions we cite; the
#                  extracted pages are verbatim, never summarised.
#   keep_between   [start_marker, end_marker] — trim extracted text to the first span
#                  starting at start_marker and ending after end_marker (verbatim).
#   effective_from / effective_to
#                  the period this text is the operative version, where the document
#                  itself states it. null = not stated by the document. Point-in-time
#                  status of individual provisions is The Status Ledger's job, not this file's.
#   version_note   what the document says about its own version.

